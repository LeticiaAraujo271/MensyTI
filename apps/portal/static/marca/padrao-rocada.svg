<svg xmlns="http://www.w3.org/2000/svg" width="300" height="260" viewBox="0 0 300 260" fill="none" stroke="#2F7F76" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Marca d'água da Central de TI. Desenhos originais, em linha:
       trator de roçada, roçadeira, soprador, motosserra, minicarregadeira e grama. -->
  <defs>
    <!-- Trator de roçada com roçadeira traseira (caixa ~72 x 56) -->
    <g id="trator">
      <path d="M24 8 H48"/>
      <path d="M26 8 V34 M46 8 L48 34"/>
      <path d="M30 12 H43 L44 28 H30 Z"/>
      <rect x="48" y="30" width="24" height="12" rx="2"/>
      <path d="M64 30 V21 M62 21 H67"/>
      <path d="M20 46 A14 14 0 0 1 48 46"/>
      <circle cx="34" cy="46" r="11"/>
      <circle cx="34" cy="46" r="3"/>
      <circle cx="65" cy="49" r="6.5"/>
      <path d="M22 40 L14 45"/>
      <rect x="0" y="43" width="14" height="8" rx="2"/>
      <path d="M-2 58 H74" stroke-dasharray="1.5 5"/>
    </g>
    <!-- Roçadeira (horizontal; girada ao usar) -->
    <g id="rocadeira">
      <rect x="-13" y="-6" width="13" height="11" rx="3"/>
      <circle cx="-6.5" cy="-0.5" r="2.4"/>
      <path d="M0 0 H52"/>
      <path d="M9 -13 Q16 -10 16 0 Q16 10 9 13"/>
      <path d="M9 -13 L6 -14 M9 13 L6 14" stroke-width="4"/>
      <path d="M30 0 C30 -6 36 -6 36 0"/>
      <rect x="51" y="-2.5" width="5" height="5" rx="1"/>
      <circle cx="60" cy="6" r="7" stroke-dasharray="2.5 1.8"/>
      <circle cx="60" cy="6" r="1.5"/>
    </g>
    <!-- Soprador de folhas -->
    <g id="soprador">
      <rect x="0" y="12" width="22" height="16" rx="6"/>
      <path d="M4 12 Q11 1 18 12"/>
      <circle cx="9" cy="20" r="3"/>
      <path d="M22 16 L52 24 M22 25 L50 30 M52 24 L50 30"/>
      <path d="M56 24 h7 M57 29 h9 M56 34 h5"/>
      <path d="M62 40 q5 -7 10 0 q-5 6 -10 0 Z M62 40 l10 0"/>
    </g>
    <!-- Motosserra -->
    <g id="motosserra">
      <rect x="0" y="10" width="22" height="18" rx="4"/>
      <path d="M3 10 Q5 1 16 2 L21 10"/>
      <path d="M19 3 L24 11"/>
      <path d="M0 20 H-6 V27 H3"/>
      <rect x="22" y="14" width="34" height="9" rx="4.5"/>
      <rect x="20" y="12" width="39" height="13" rx="6.5" stroke-width="1.6" stroke-dasharray="1.5 2.5"/>
      <circle cx="9" cy="19" r="2.5"/>
    </g>
    <!-- Minicarregadeira (pá carregadeira compacta) -->
    <g id="carregadeira">
      <rect x="18" y="4" width="22" height="24" rx="3"/>
      <path d="M24 4 V28 M18 14 H40"/>
      <rect x="40" y="13" width="12" height="15" rx="2"/>
      <path d="M50 10 H14 L8 26"/>
      <path d="M-2 24 L8 22 L10 34 L-4 34 Z"/>
      <circle cx="24" cy="36" r="6.5"/>
      <circle cx="44" cy="36" r="6.5"/>
      <circle cx="24" cy="36" r="1.8"/>
      <circle cx="44" cy="36" r="1.8"/>
    </g>
    <!-- Tufos de grama -->
    <path id="grama" d="M0 14 L3 2 L6 14 M3 14 L-4 6 M3 14 L10 6"/>
    <path id="graminha" d="M0 8 L2.5 0 L5 8"/>
  </defs>

  <use href="#trator" transform="translate(14 18) scale(.62)"/>
  <use href="#rocadeira" transform="translate(132 14) rotate(38) scale(.7)"/>
  <use href="#soprador" transform="translate(214 34) scale(.62)"/>
  <use href="#motosserra" transform="translate(36 136) rotate(-14) scale(.62)"/>
  <use href="#carregadeira" transform="translate(156 126) scale(.72)"/>
  <use href="#rocadeira" transform="translate(262 150) rotate(118) scale(.55)"/>

  <use href="#grama" transform="translate(100 80) scale(.8)"/>
  <use href="#grama" transform="translate(262 112) scale(.7)"/>
  <use href="#grama" transform="translate(22 226) scale(.8)"/>
  <use href="#grama" transform="translate(206 222) scale(.7)"/>
  <use href="#graminha" transform="translate(118 206)"/>
  <use href="#graminha" transform="translate(70 92)"/>
  <use href="#graminha" transform="translate(286 236)"/>
  <use href="#graminha" transform="translate(150 246)"/>
  <use href="#graminha" transform="translate(240 10)"/>
</svg>
