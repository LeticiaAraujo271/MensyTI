{% extends "painel/base.html" %}
{% block titulo %}Entrar · Painel de TI{% endblock %}
{% block conteudo %}
<section class="cartao estreito">
  <h1>Entrar no painel de TI</h1>
  {% if form.errors %}<div class="aviso error">Usuário ou senha incorretos.</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Usuário <input type="text" name="username" autofocus required autocomplete="username"></label>
    <label>Senha <input type="password" name="password" required autocomplete="current-password"></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="primario">Entrar</button>
  </form>
</section>
{% endblock %}
